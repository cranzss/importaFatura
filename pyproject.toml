[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fatura-parser"
version = "0.1.0"
description = "Extrai faturas de cartão em PDF para um JSON padronizado."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "pdfplumber>=0.11,<0.12",
    "pydantic>=2.13,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
    "httpx2>=2.13,<3",
    "reportlab>=4,<5",
]
security = [
    "pip-audit>=2.10,<3",
]

[project.scripts]
fatura-parser = "fatura_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
